version: 2

sources: 
  - name: source_2 
    database: DEMO_DATABASE
    schema: DBT_AADITYA
    tables:
      - name: cust
      - name: orders
      - name: SOMETABLE

  - name: 1source  
    database: DEMO_DATABASE
    schema: RAW
    tables:
      - name: PIL_RAW
      - name: marketing
       
models:
  - name: pil_raw   
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: gender
        tests:
          - accepted_values:
              arguments:
                values: ['Male' ,'Female']     
  - name: pil_rawbkup
    columns:
      - name: id
        tests:
          - relationships:
              arguments:
                to: ref('pil_raw')  
                field: id
  - name: marketing
    columns:
      - name: sales
        tests:
          - new_test
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:  # Indented with 14 spaces
                min_value: 0  # Indented with 16 spaces to nest inside arguments
                max_value: 5000000
                

